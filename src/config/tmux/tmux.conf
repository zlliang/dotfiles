# Highly inspired by Omarchy 4.0's tmux configuration:
# https://github.com/basecamp/omarchy/blob/quattro/config/tmux/tmux.conf.

# Prefix
set -g prefix C-a
set -g prefix2 C-b
bind -N 'Send prefix' C-space send-prefix

# Window controls
bind -N 'Kill window' X kill-window

# Pane controls
bind -N 'Split pane horizontally' h split-window -h -c '#{pane_current_path}'
bind -N 'Split pane vertically' v split-window -v -c '#{pane_current_path}'
bind -N 'Kill pane' x kill-pane
bind -N 'Resize pane left' -r < resize-pane -L 5
bind -N 'Resize pane up' -r + resize-pane -U 5
bind -N 'Resize pane right' -r > resize-pane -R 5
bind -N 'Resize pane down' -r - resize-pane -D 5

# Popups
# Popups cannot query the terminal theme, so pass tmux's detected theme via COLORFGBG.
set -s command-alias[100] 'themed-popup=display-popup -E -e "COLORFGBG=#{?#{==:#{client_theme},light},0;15,15;0}" -w 75% -h 75% -d "#{pane_current_path}"'
bind -N 'Open popup terminal' p themed-popup
bind -N 'Open lazygit pop' g themed-popup lazygit

# General
set -g default-terminal 'tmux-256color'
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ''
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h - #S - #I:#W - #T'

# Theme
set -g status-style 'bg=default,fg=default'
set -g status-left '#[fg=blue,bg=terminal,bold,reverse] #S #[default] '
set -g status-right '#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h'
set -g window-status-format '#[fg=brightblack] #I:#W '
set -g window-status-current-format '#[fg=blue,bold] #I:#W '
set -g pane-border-status top
set -g pane-border-format '#[align=right]#{?pane_active,#[fg=blue#,bg=terminal#,reverse],#[fg=brightblack#,bg=terminal]} #{pane_index} #[default]─' # single → ─, double → ═, heavy → ━, simple → -
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=brightblack'
set -g message-style 'bg=default,fg=blue'
set -g message-command-style 'bg=default,fg=blue'
set -g mode-style 'bg=blue,fg=black'
setw -g clock-mode-colour blue
