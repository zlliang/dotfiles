[settings]
use_versions_host = false
fetch_remote_versions_cache = "0s"
minimum_release_age = "0s"
npm.package_manager = "npm"

[tools]
# Shell tools
"eza" = "latest"
"zoxide" = "latest"
"bat" = "latest"
"ripgrep" = "latest"
"fd" = "latest"
"jq" = "latest"
"lazygit" = "latest"
"gh" = "latest"
"btop" = { version = "latest", os = ["linux"] }
"tlrc" = "latest"
"usage" = "latest" # Required for generating mise's shell completions.
# Development
"tmux" = "latest"
"neovim" = "latest"
"tree-sitter" = "latest"
"gem:try-cli" = "latest"
# Languages
"node" = "lts"
"bun" = "latest"
"npm:corepack" = { version = "latest", allow_builds = true }
"python" = "latest"
"uv" = "latest"
"rust" = "latest"
"ruby" = "latest" # Required by try-cli.
# AI tools
"npm:@ampcode/cli" = { version = "latest", allow_builds = true }
"npm:@earendil-works/pi-coding-agent" = { version = "latest", allow_builds = true }
"npm:agent-browser" = { version = "latest", allow_builds = true }
"npm:mcporter" = { version = "latest", allow_builds = true }

[tasks.update]
description = "Update the development environment"
quiet = true
run = [
  { task = "update:dotfiles" },
  "exec mise run update:rest",
]

[tasks."update:rest"]
hide = true
run = [
  { task = "update:packages" },
  { task = "update:mise" },
  { task = "update:pnpm" },
  { task = "update:pi" },
  { task = "update:agent-skills" },
  {%- if "work" in mise_env %}
  { task = "update:bk" },
  {%- endif %}
]

[tasks."update:dotfiles"]
description = "Update managed repos and converge the machine"
dir = "{{ env.HOME }}/workspace/github/zlliang/dotfiles"
run = ["mise bootstrap repos update -y", "mise bootstrap -y"]

[tasks."update:packages"]
description = "Upgrade managed system packages"
dir = "{{ env.HOME }}/workspace/github/zlliang/dotfiles"
run = "mise bootstrap packages upgrade -y"

[tasks."update:mise"]
description = "Update mise and managed tools"
run = ["mise self-update -y", "mise upgrade -y", "mise prune -y"]

[tasks."update:pnpm"]
description = "Update pnpm"
run = "corepack prepare pnpm@latest --activate"

[tasks."update:pi"]
description = "Update Pi extensions"
dir = "{{ env.HOME }}/.pi/agent/extensions"
run = ["pi update --extensions", "npm update"]

[tasks."update:agent-skills"]
description = "Update global agent skills"
run = [
  "rm -rf ~/.agents ~/.pi/agent/skills",
  "npx -y skills add zlliang/skills --full-depth -g -y -a amp",
  "npx -y skills add vercel-labs/agent-browser --skill agent-browser --full-depth -g -y -a amp",
]
