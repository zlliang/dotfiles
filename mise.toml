min_version = "2026.7.5"

[settings]
dotfiles.default_mode = "template"

[bootstrap.repos]
"~/workspace/github/zlliang/zlliang" = { url = "https://github.com/zlliang/zlliang.git" }
"~/workspace/github/zlliang/dotfiles" = { url = "https://github.com/zlliang/dotfiles.git" }
"~/workspace/github/zlliang/skills" = { url = "https://github.com/zlliang/skills.git" }

[dotfiles]
"~/.config/amp/AGENTS.md" = "templates/AGENTS.md"
"~/.config/amp/settings.json" = "src/config/amp/settings.json"
"~/.config/fish/functions" = { source = "src/config/fish/functions", mode = "copy" }
"~/.config/fish/config.fish" = "src/config/fish/config.fish"
"~/.config/mise/config.toml" = "src/config/mise/config.toml"
"~/.config/mise/miserc.toml" = "src/config/mise/miserc.toml"
"~/.config/vim/vimrc" = "src/config/vim/vimrc"
"~/.mcporter/mcporter.json" = "src/mcporter/mcporter.json"
"~/.pi/agent/extensions" = { source = "src/pi/agent/extensions", mode = "copy" }
"~/.pi/agent/prompts" = { source = "src/pi/agent/prompts", mode = "copy" }
"~/.pi/agent/AGENTS.md" = "templates/AGENTS.md"
"~/.pi/agent/dispatcher.json" = "src/pi/agent/dispatcher.json"
"~/.pi/agent/settings.json" = "src/pi/agent/settings.json"
"~/.pi/agent/spark.json" = "src/pi/agent/spark.json"
"~/.gitconfig" = "src/gitconfig"
"~/.gitignore" = "src/gitignore"
"~/.hushlogin" = "src/hushlogin"

# One-time migrations, each dated when added: delete a line once every machine has run it.
[bootstrap.hooks.final]
run = [
  # 2026-07-14: Amp became a mise-managed tool; drop the self-managed installation.
  "rm -rf ~/.amp/bin ~/.local/bin/amp",
  # 2026-07-15: Work-local vars moved from ~/.config/mise into the repository.
  "if [ -f ~/.config/mise/config.work.local.toml ]; then rm -f ~/workspace/github/zlliang/dotfiles/mise.work.local.toml && mv ~/.config/mise/config.work.local.toml ~/workspace/github/zlliang/dotfiles/mise.work.local.toml; fi",
  # 2026-07-17: The tm prompt was renamed to cm; drop the stale copy.
  "rm -f ~/.pi/agent/prompts/tm.md",
  # 2026-07-23: The package manager for npm packages changed to pnpm; drop obsolete aube data.
  "rm -rf ~/.cache/aube ~/.local/share/aube ~/Library/Caches/aube",
  # 2026-08-03: Raft is no longer used; drop its leftover state.
  "rm -rf ~/.slock",
  # 2026-08-12: Vim configuration moved to ~/.config/vim/vimrc.
  "rm -f ~/.vimrc",
  # 2026-08-26: The tdl fish function was removed; drop the stale copy.
  "rm -f ~/.config/fish/functions/tdl.fish",
  # 2026-08-27: btop is no longer used; drop its config and macOS package.
  "rm -rf ~/.config/btop; if [ \"$(uname)\" = Darwin ] && command -v brew >/dev/null 2>&1 && brew list --formula btop >/dev/null 2>&1; then brew remove btop; fi",
  # 2026-08-28: lazygit is no longer used; drop its config.
  "rm -rf ~/.config/lazygit ~/.local/state/lazygit",
  # 2026-08-30: Rust is no longer used; drop its toolchains.
  "rm -rf ~/.rustup ~/.cargo",
  # 2026-08-30: Neovim and Tree-sitter are no longer used; drop their files.
  "rm -rf ~/workspace/github/zlliang/nvim ~/.config/nvim ~/.local/share/nvim ~/.local/state/nvim ~/.cache/nvim ~/.tree-sitter ~/.config/tree-sitter ~/.cache/tree-sitter",
  # 2026-08-30: tmux is no longer used; drop its configuration and plugin data.
  "rm -rf ~/.config/tmux ~/.local/share/tmux ~/.local/state/tmux ~/.cache/tmux",
]
