min_version = "2026.7.5"

[settings]
dotfiles.default_mode = "template"

[bootstrap.repos]
"~/workspace/github/zlliang/zlliang" = { url = "https://github.com/zlliang/zlliang.git" }
"~/workspace/github/zlliang/dotfiles" = { url = "https://github.com/zlliang/dotfiles.git" }
"~/workspace/github/zlliang/skills" = { url = "https://github.com/zlliang/skills.git" }

[dotfiles]
"~/.config/amp/AGENTS.md" = "templates/AGENTS.md"
"~/.config/amp/settings.json" = "src/config/amp/settings.json"
"~/.config/fish/functions" = { source = "src/config/fish/functions", mode = "copy" }
"~/.config/fish/config.fish" = "src/config/fish/config.fish"
"~/.config/mise/config.toml" = "src/config/mise/config.toml"
"~/.config/mise/miserc.toml" = "src/config/mise/miserc.toml"
"~/.config/vim/vimrc" = "src/config/vim/vimrc"
"~/.mcporter/mcporter.json" = "src/mcporter/mcporter.json"
"~/.pi/agent/extensions" = { source = "src/pi/agent/extensions", mode = "copy" }
"~/.pi/agent/prompts" = { source = "src/pi/agent/prompts", mode = "copy" }
"~/.pi/agent/AGENTS.md" = "templates/AGENTS.md"
"~/.pi/agent/dispatcher.json" = "src/pi/agent/dispatcher.json"
"~/.pi/agent/settings.json" = "src/pi/agent/settings.json"
"~/.pi/agent/spark.json" = "src/pi/agent/spark.json"
"~/.gitconfig" = "src/gitconfig"
"~/.gitignore" = "src/gitignore"
"~/.hushlogin" = "src/hushlogin"

# One-time migrations, each dated when added: delete a line once every machine has run it.
[bootstrap.hooks.final]
run = [
  # 2026-07-17: The `tm` prompt template was renamed to cm; drop the stale copy.
  "rm -f ~/.pi/agent/prompts/tm.md",
  # 2026-08-12: Vim configuration moved to `~/.config/vim/vimrc`.
  "rm -f ~/.vimrc",
  # 2026-08-30: Rust is no longer used; drop its toolchains.
  "rm -rf ~/.rustup ~/.cargo",
  # 2026-08-30: agent-browser was removed; drop its data.
  "rm -rf ~/.agent-browser",
]
