name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    env:
      PROFILE: personal
      GITHUB_TOKEN: ${{ github.token }}
      NO_COLOR: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Link repository into the expected location
        run: |
          mkdir -p "$HOME/workspace/github/zlliang"
          ln -s "$GITHUB_WORKSPACE" "$HOME/workspace/github/zlliang/dotfiles"

      - name: Allow passwordless shell changes on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/chsh <<'EOF'
          #!/bin/sh
          exec sudo -n /usr/bin/chsh "$@" "$USER"
          EOF
          chmod +x ~/.local/bin/chsh

      - name: Bootstrap
        run: ./bootstrap.sh

      - name: Verify bootstrap state
        run: ~/.local/bin/mise bootstrap status --missing
